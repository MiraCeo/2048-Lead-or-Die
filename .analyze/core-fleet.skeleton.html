<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>核心群岛 · 含七关互动教程</title>
<style/>
</head><body><main class="shell"><header><div class="brand"><div class="mark">✣</div><div><h1>核心群岛</h1><div class="en">CORE ARCHIPELAGO / EXPEDITION 10 / CONTACT & SUPPORT</div></div></div><div class="header-actions"><span class="badge">100 × 100 世界 · 25 × 25 视野</span><button id="showTutorial">互动教程 · 7关</button><button id="showGuide">游戏介绍 ↗</button></div></header><div class="layout">
<aside><div class="panel"><h2>COMMAND / 当前核心</h2><div class="big" id="coreNumber"></div><div class="stat"><span>共享 core</span><strong id="sharedCore"></strong></div><div class="stat"><span>世界回合</span><strong id="turn"></strong></div><div class="stat"><span>主体 / 其他己方</span><strong id="members"></strong></div><div class="divider"></div><div class="stat"><span>目标</span><strong id="goalProgress"></strong></div><div class="stat"><span>合成分</span><strong id="score"></strong></div></div><div class="panel"><h2>ACTIONS / 行动储备</h2><div class="inline-bank"><strong id="ap"></strong><span class="mini-detail">额外行动点<br>每2回合 +1</span></div><div class="stat"><span>下一点</span><strong id="apNext"></strong></div></div><div class="panel"><h2>FLEETS / 切换与回到核心</h2><div id="fleets" class="compact-list"></div></div><div class="panel"><h2>SCAN / 悬停扫描</h2><div id="inspect" class="inspect">悬停数字查看归属、血量和编队规模。</div></div></aside>
<section class="play-area"><div class="topbar"><div class="play-heading"><span><i class="dot"></i><span id="modeLabel"></span></span><span id="targetCount"></span></div><div class="map-actions"><button id="undo" title="撤销上一次操作（Z）">↶ 撤销 <span id="undoCount"></span></button><button id="restart" title="重新开始本局">↻ 重开</button></div></div><div class="board"><div id="gameOver" style="display:none;position:absolute;inset:8px;background:#10201aed;z-index:2;align-items:center;justify-content:center;flex-direction:column;border-radius:8px;backdrop-filter:blur(6px)"><h2 id="endTitle" style="font-size:28px;color:#e6efda">舰队失去指挥</h2><p id="endText" class="muted"></p><button id="resume" style="display:none;margin-bottom:10px">继续挑战</button><button id="endUndo">撤销上一操作</button><button id="endRestart" style="margin-top:12px">重新出发</button></div><canvas id="canvas" width="860" height="886" tabindex="0" aria-label="100乘100世界，所选核心周围25乘25视野"></canvas></div><div id="previewHint" class="mini-detail map-keyhint">WASD / 方向键移动 · 点击己方数字单独调整 · 拖动两块互换 · Esc 返回主体 · Shift + 方向预览</div><div id="status" class="status" role="status">正在初始化游戏…若此提示持续显示，请反馈当前页面截图。</div></section>
<aside class="right"><div class="panel"><h2>WORLD / 全图态势</h2><canvas id="minimap" width="300" height="300" aria-label="全图小地图，绿色己方，红色敌方，金色中立组，灰点散落数字，白框当前视野"></canvas><div class="map-legend"><span><i style="background:#b7e991"></i>己方单位</span><span><i style="background:#ed816d"></i>敌方单位</span><span><i style="background:#dcb66e"></i>中立组</span><span><i style="background:#788773"></i>散落数字</span><span><i style="border:1px solid #fff"></i>当前视野</span><span>○ 核心 / ▣ 友方碉堡</span></div><div class="mini-detail" style="margin-top:9px">点击绿色核心标记切换视野</div></div><div class="panel"><h2>THREAT / 战场节奏</h2><div class="stat"><span>增援 / 等级</span><strong id="waveInfo"></strong></div><div class="stat"><span>己方 / 敌方核心</span><strong id="coreCounts"></strong></div><div class="stat"><span>友方碉堡 / 下次支援</span><strong id="supportStatus"></strong></div><div class="stat"><span>常规敌方行动</span><strong id="enemyNext"></strong></div><div class="stat"><span>中立数字 / 组</span><strong id="neutral"></strong></div><div class="divider"></div><div class="mini-detail">补给：视野内每2回合 +1，视野外每回合 +3<br>敌方全图均匀增援 · 每20回合友方碉堡支援</div></div><div class="panel"><h2>COMMS / 最近战报</h2><div id="log" class="log"></div></div></aside></div><footer><span>EXPLORATION · FORMATION · 2048</span><span>自动保存 · 详细机制已移至游戏介绍</span></footer></main><dialog id="dialog"><h3>重新部署远征？</h3><p>重置100×100地图、敌我编队、行动点和撤销记录，开启一场新的远征。</p><button id="cancel">继续探索</button><button id="confirm">确认重开</button></dialog>
<dialog id="tutorialDialog" aria-label="七关互动教程"><div class="tutorial-bar"><span>互动教程 · 独立进度 / 正式对局已暂停</span><button id="closeTutorial">返回当前对局 ✕</button></div><iframe id="tutorialFrame" title="核心群岛七关互动教程" sandbox="allow-scripts"></iframe></dialog><dialog id="goalDialog"><div class="muted" style="letter-spacing:3px;color:#e7dca0">MILESTONE REACHED</div><h2 style="font-size:38px;color:#fff0a3;margin:16px 0">2048 达成！</h2><p id="goalText"></p><p>这不是终点。你可以结算本次远征，也可以继续合成更大的数字。</p><button id="settleGoal">结算远征</button><button id="continueGoal">继续挑战</button></dialog><dialog id="guideDialog" class="guide-dialog"><div class="guide-bar"><span>游戏介绍 · 独立阅读页</span><button id="closeGuide">关闭 ✕</button></div><iframe id="guideFrame" title="核心群岛游戏介绍" sandbox="allow-scripts"></iframe></dialog>
<script/>
</body></html>
